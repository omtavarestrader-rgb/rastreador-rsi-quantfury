<title>Rastreador RSI Quantfury</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de resumo, mapa de dispersão do RSI 0-100, tabela filtrável com sparkline */
:root{--bg:#f3f5f7;--surface:#fff;--fg:#14202b;--muted:#5d6b78;--line:#dbe1e7;--ob:#c2362b;--ob-bg:#fbe9e7;--os:#0b7a5a;--os-bg:#e2f4ee;--accent:#1c4f82;--mid:#e9edf1;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--surface:#151d24;--fg:#e4eaef;--muted:#8d9ba8;--line:#27323c;--ob:#ff7a6e;--ob-bg:#3a1f1d;--os:#4fd1a5;--os-bg:#14322a;--accent:#7fb2e8;--mid:#1d2832;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--surface:#151d24;--fg:#e4eaef;--muted:#8d9ba8;--line:#27323c;--ob:#ff7a6e;--ob-bg:#3a1f1d;--os:#4fd1a5;--os-bg:#14322a;--accent:#7fb2e8;--mid:#1d2832;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:end}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.ob b{color:var(--ob)}.stat.os b{color:var(--os)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
#map{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--fg);font:inherit;padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input[type=number]{width:64px;font-family:var(--mono)}
input[type=search]{width:140px}
label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:940px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;background:var(--surface);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sym{font-weight:600}.grp{display:block;font-size:11px;color:var(--muted);font-weight:400}
.rsi{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:70px;height:6px;background:var(--mid);border-radius:3px;position:relative}
.bar i{position:absolute;top:-2px;width:3px;height:10px;border-radius:1px;background:var(--fg);transform:translateX(-1px)}
.bar::before,.bar::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6}
.bar::before{left:var(--lo)}.bar::after{left:var(--hi)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
.tag.ob{background:var(--ob-bg);color:var(--ob)}.tag.os{background:var(--os-bg);color:var(--os)}.tag.ne{color:var(--muted)}
.up{color:var(--os)}.dn{color:var(--ob)}
tr.ob td:first-child{box-shadow:inset 3px 0 var(--ob)}tr.os td:first-child{box-shadow:inset 3px 0 var(--os)}
.r2.ob{color:var(--ob);font-weight:600}.r2.os{color:var(--os);font-weight:600}.more{margin:0 auto}.more.btn{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.upd{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px;max-width:80ch}
.empty{padding:28px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
</style>
<div class="wrap">
<header>
 <div><h1>Rastreador RSI Quantfury</h1><div class="sub">Cripto, ações, ETFs, futuros e câmbio da Quantfury, com RSI(14) e RSI(2) diários</div></div>
 <div class="hd-r"><div class="stamp" id="stamp"></div><button id="refresh" class="btn" type="button" hidden>Atualizar dados</button><div class="stamp" id="rmsg" role="status"></div></div>

<section class="stats" id="stats"></section>
<section class="panel"><h2>Onde cada ativo está na escala do RSI</h2><svg id="map" viewBox="0 0 960 120" role="img" aria-label="Distribuição do RSI dos ativos"></svg></section>
<section class="controls">

</section>

<button id="more" class="btn more" type="button" hidden></button>
<p class="note" id="foot"></p>
</div>
