name: Atualizar RSI
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: atualizar-rsi
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular RSI (apenas mercados abertos)
        run: python3 -I rsi_all.py --auto
      - name: Gerar página
        run: |
          python3 -I build.py
          mv rastreador-rsi.html index.html
      - name: Publicar
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          git add data_all.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dados"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
      - name: Reagendar em 30 minutos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 1500
          fila=$(gh run list --workflow atualizar.yml --status queued --json databaseId --jq length)
          andamento=$(gh run list --workflow atualizar.yml --status in_progress --json databaseId --jq length)
          if [ "$fila" -eq 0 ] && [ "$andamento" -le 1 ]; then
            gh workflow run atualizar.yml --ref main
          fi
