name: Atualizar RSI
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: atualizar-rsi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular RSI (apenas mercados abertos)
        run: python3 -I rsi_all.py --auto
      - name: Gerar página
        run: |
          python3 -I build.py
          mv rastreador-rsi.html index.html
      - name: Publicar
        run: |
          git config user.name "rsi-bot"
          git config user.email "rsi-bot@users.noreply.github.com"
          git add data_all.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza dados"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          exit 1
  reagendar:
    needs: atualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Esperar e disparar a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 1500
          # só a execução mais recente continua o ciclo; assim sobra sempre uma única corrente
          novas=0
          for st in queued in_progress; do
            n=$(gh run list --workflow atualizar.yml --status $st --json databaseId --jq "[.[].databaseId | select(. > $RUN_ID)] | length")
            novas=$((novas + n))
          done
          if [ "$novas" -eq 0 ]; then
            gh workflow run atualizar.yml --ref main
          fi
